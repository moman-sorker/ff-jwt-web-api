<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Token Generator - M. Sarker</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 50%, #0d0d3b 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animation span {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        .bg-animation span:nth-child(1) { left: 10%; animation-duration: 18s; }
        .bg-animation span:nth-child(2) { left: 20%; animation-duration: 22s; animation-delay: 2s; }
        .bg-animation span:nth-child(3) { left: 35%; animation-duration: 16s; animation-delay: 4s; }
        .bg-animation span:nth-child(4) { left: 50%; animation-duration: 20s; animation-delay: 1s; }
        .bg-animation span:nth-child(5) { left: 65%; animation-duration: 19s; animation-delay: 3s; }
        .bg-animation span:nth-child(6) { left: 75%; animation-duration: 21s; animation-delay: 5s; }
        .bg-animation span:nth-child(7) { left: 85%; animation-duration: 17s; animation-delay: 2s; }
        .bg-animation span:nth-child(8) { left: 90%; animation-duration: 23s; animation-delay: 4s; }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 30px 0;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, transparent);
            border-radius: 2px;
        }

        .header .logo {
            font-size: 3em;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            letter-spacing: 2px;
        }

        .header .subtitle {
            color: #8892b0;
            font-size: 1.1em;
            margin-top: 10px;
        }

        .header .status-badge {
            display: inline-block;
            background: rgba(107, 203, 119, 0.2);
            border: 1px solid #6bcb77;
            color: #6bcb77;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 8px;
        }

        .header .status-badge i {
            margin-right: 6px;
        }

        /* Main Card */
        .main-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            margin-top: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .main-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
        }

        /* Input Section */
        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 768px) {
            .input-section {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            position: relative;
        }

        .input-group label {
            display: block;
            color: #ccd6f6;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .input-group label i {
            margin-right: 8px;
            color: #4d96ff;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #4d96ff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(77, 150, 255, 0.1);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-group input.error {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1);
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: center;
            min-width: 150px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4d96ff, #6c5ce7);
            color: #fff;
            box-shadow: 0 4px 15px rgba(77, 150, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(77, 150, 255, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #6bcb77, #2d8f43);
            color: #fff;
            box-shadow: 0 4px 15px rgba(107, 203, 119, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(107, 203, 119, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #c0392b);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccd6f6;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Response Section */
        .response-section {
            margin-top: 25px;
            display: none;
        }

        .response-section.active {
            display: block;
            animation: fadeSlideIn 0.5s ease;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .response-header h3 {
            color: #ccd6f6;
            font-size: 1.1em;
        }

        .response-header .status-badge-response {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .status-success {
            background: rgba(107, 203, 119, 0.2);
            color: #6bcb77;
            border: 1px solid #6bcb77;
        }

        .status-error {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        /* Response Cards */
        .response-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .response-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .response-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .response-item .label {
            color: #8892b0;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .response-item .value {
            color: #e6f1ff;
            font-size: 1em;
            margin-top: 4px;
            word-break: break-all;
            font-weight: 500;
        }

        .response-item .value.highlight {
            color: #ffd93d;
            font-weight: 700;
        }

        .response-item .value.token {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .response-item .value .copy-btn {
            background: none;
            border: none;
            color: #4d96ff;
            cursor: pointer;
            font-size: 0.9em;
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.2s;
            margin-left: 8px;
        }

        .response-item .value .copy-btn:hover {
            background: rgba(77, 150, 255, 0.15);
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .quick-actions .btn {
            flex: 0 1 auto;
            min-width: auto;
            padding: 8px 18px;
            font-size: 0.85em;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 24px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95em;
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-left: 4px solid #6bcb77;
        }

        .toast.error {
            border-left: 4px solid #ff6b6b;
        }

        .toast .toast-icon {
            font-size: 1.3em;
        }

        .toast.success .toast-icon { color: #6bcb77; }
        .toast.error .toast-icon { color: #ff6b6b; }

        /* Responsive */
        @media (max-width: 480px) {
            .header .logo { font-size: 2em; }
            .main-card { padding: 20px; }
            .btn { padding: 12px 20px; font-size: 0.9em; }
            .response-grid { grid-template-columns: 1fr; }
            .quick-actions .btn { flex: 1; justify-content: center; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Pulse animation for live indicator */
        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Extra styles for ban info */
        .ban-info {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.2);
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 16px;
        }

        .ban-info .ban-label {
            color: #ff6b6b;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="bg-animation">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
</div>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo">FF Token Generator</div>
        <div class="subtitle">
            <i class="fas fa-shield-alt" style="color: #4d96ff;"></i>
            Secure &bull; Fast &bull; Reliable
        </div>
        <div class="status-badge">
            <i class="fas fa-circle pulse" style="font-size: 0.6em;"></i>
            System Online
        </div>
    </div>

    <!-- Main Card -->
    <div class="main-card">
        <!-- Input Section -->
        <div class="input-section">
            <div class="input-group">
                <label for="uidInput">
                    <i class="fas fa-id-card"></i> UID
                </label>
                <input
                    type="text"
                    id="uidInput"
                    placeholder="Enter User ID"
                    autocomplete="off"
                >
            </div>
            <div class="input-group">
                <label for="passwordInput">
                    <i class="fas fa-key"></i> Password
                </label>
                <input
                    type="password"
                    id="passwordInput"
                    placeholder="Enter Password"
                    autocomplete="off"
                >
            </div>
        </div>

        <!-- Buttons -->
        <div class="btn-group">
            <button id="generateBtn" class="btn btn-primary">
                <i class="fas fa-wand-magic-sparkles"></i>
                <span id="btnText">Generate Token</span>
            </button>
            <button id="clearBtn" class="btn btn-outline">
                <i class="fas fa-eraser"></i> Clear
            </button>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="btn btn-outline" onclick="copyToken()">
                <i class="fas fa-copy"></i> Copy JWT Token
            </button>
        </div>
        
        <div class="quick-actions">
            <button class="btn btn-outline" onclick="copyAccess()">
                <i class="fas fa-copy"></i> Copy Access Token
            </button>
        </div>

        <!-- Response Section -->
        <div id="responseSection" class="response-section">
            <div class="response-header">
                <h3><i class="fas fa-receipt"></i> Response</h3>
                <span id="statusBadge" class="status-badge-response status-success">
                    <i class="fas fa-check-circle"></i> Success
                </span>
            </div>

            <div id="responseContent" class="response-grid">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div style="text-align: center; margin-top: 30px; color: rgba(255,255,255,0.2); font-size: 0.8em;">
        <i class="fas fa-code"></i> M. Sarker &bull; Powered by Sarker
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast">
    <span class="toast-icon"><i class="fas fa-check-circle"></i></span>
    <span id="toastMessage">Success!</span>
</div>

<script>
    // DOM Elements
    const uidInput = document.getElementById('uidInput');
    const passwordInput = document.getElementById('passwordInput');
    const generateBtn = document.getElementById('generateBtn');
    const clearBtn = document.getElementById('clearBtn');
    const btnText = document.getElementById('btnText');
    const responseSection = document.getElementById('responseSection');
    const responseContent = document.getElementById('responseContent');
    const statusBadge = document.getElementById('statusBadge');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');

    // Example accounts
    function setExample1() {
        uidInput.value = '1234567890';
        passwordInput.value = 'password123';
        showToast('Example account loaded', 'success');
    }

    function setExample2() {
        uidInput.value = '9876543210';
        passwordInput.value = 'pass1234';
        showToast('Example account loaded', 'success');
    }

    // Toast
    function showToast(message, type = 'success') {
        toast.className = 'toast ' + type;
        toastMessage.textContent = message;
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // Copy JWT Token
    function copyToken() {
        const tokenElement = document.querySelector('.jwt-token-value');
        if (tokenElement) {
            const token = tokenElement.textContent.trim();
            navigator.clipboard.writeText(token).then(() => {
                showToast('JWT Token copied to clipboard!', 'success');
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = token;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('JWT Token copied to clipboard!', 'success');
            });
        } else {
            showToast('No token to copy', 'error');
        }
    }
    
    // Copy Access
    function copyAccess() {
        const token_accessElement = document.querySelector('.access-token-value');
        if (token_accessElement) {
            const token_access = token_accessElement.textContent.trim();
            navigator.clipboard.writeText(token_access).then(() => {
                showToast('Access Token copied to clipboard!', 'success');
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = token_access;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('Access Token copied to clipboard!', 'success');
            });
        } else {
            showToast('No token to copy', 'error');
        }
    }

    // Generate Token
    async function generateToken() {
        const uid = uidInput.value.trim();
        const password = passwordInput.value.trim();

        // Validate
        let isValid = true;
        if (!uid) {
            uidInput.classList.add('error');
            isValid = false;
        } else {
            uidInput.classList.remove('error');
        }
        if (!password) {
            passwordInput.classList.add('error');
            isValid = false;
        } else {
            passwordInput.classList.remove('error');
        }

        if (!isValid) {
            showToast('Please fill all fields', 'error');
            return;
        }

        // Show loading
        generateBtn.disabled = true;
        btnText.innerHTML = '<span class="spinner"></span> Generating...';

        try {
            const response = await fetch(`/token?uid=${encodeURIComponent(uid)}&password=${encodeURIComponent(password)}`);
            const data = await response.json();

            // Hide any previous error state
            uidInput.classList.remove('error');
            passwordInput.classList.remove('error');

            // Display response
            displayResponse(data);

            if (data.error === true || data.error === 'True' || data.status_code >= 400) {
                showToast('Failed to generate token', 'error');
                statusBadge.className = 'status-badge-response status-error';
                statusBadge.innerHTML = '<i class="fas fa-times-circle"></i> Error';
            } else {
                showToast('Token generated successfully!', 'success');
                statusBadge.className = 'status-badge-response status-success';
                statusBadge.innerHTML = '<i class="fas fa-check-circle"></i> Success';
            }

        } catch (error) {
            showToast('Network error: ' + error.message, 'error');
            statusBadge.className = 'status-badge-response status-error';
            statusBadge.innerHTML = '<i class="fas fa-times-circle"></i> Error';
        } finally {
            generateBtn.disabled = false;
            btnText.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> Generate Token';
        }
    }

    // Display Response
    function displayResponse(data) {
        responseSection.classList.add('active');

        let html = '';

        // Check if error
        if (data.error === true || data.error === 'True' || data.status_code >= 400) {
            html += `
                <div style="grid-column: 1/-1; padding: 20px; background: rgba(255,107,107,0.05); border-radius: 12px; border: 1px solid rgba(255,107,107,0.2);">
                    <div style="color: #ff6b6b; font-size: 1.1em; margin-bottom: 8px;">
                        <i class="fas fa-exclamation-triangle"></i> Error
                    </div>
                    <div style="color: #ccd6f6;">
                        ${data.message || data.message1 || data.message2 || data.message5 || 'Unknown error occurred'}
                    </div>
                    ${data.reason ? `<div style="color: #ffd93d; margin-top: 8px;">Reason: ${data.reason}</div>` : ''}
                    ${data.ban_date ? `<div style="color: #ff6b6b; margin-top: 8px;">Ban Date: ${data.ban_date}</div>` : ''}
                    ${data.ban_type ? `<div style="color: #ff6b6b; margin-top: 4px;">Ban Type: ${data.ban_type}</div>` : ''}
                    ${data.status_code ? `<div style="color: #8892b0; margin-top: 8px; font-size: 0.85em;">Status Code: ${data.status_code}</div>` : ''}
                </div>
            `;
        } else {
            // Success - show all fields
            const fields = [
                { key: 'account_id', label: 'Account ID', icon: 'fa-id-badge' },
                { key: 'nickname', label: 'Nickname', icon: 'fa-user' },
                { key: 'level', label: 'Level', icon: 'fa-level-up-alt' },
                { key: 'exp', label: 'Experience', icon: 'fa-star' },
                { key: 'server', label: 'Server', icon: 'fa-globe' },
                { key: 'api', label: 'API', icon: 'fa-code' },
                { key: 'token', label: 'JWT Token', icon: 'fa-key', isToken: true },
                { key: 'open_id', label: 'Open ID', icon: 'fa-fingerprint' },
                { key: 'token_access', label: 'Access Token', icon: 'fa-lock', isAccess: true },
                { key: 'status_code', label: 'Status Code', icon: 'fa-check-circle' },
            ];

            for (const field of fields) {
                if (data[field.key] !== undefined && data[field.key] !== null && data[field.key] !== '') {
                    let value = data[field.key];
                    let extraClass = '';
                    let extraHtml = '';

                    if (field.isToken) {
                        extraClass = 'token jwt-token-value';
                        extraHtml = `<button class="copy-btn" onclick="copyToken()" title="Copy"><i class="fas fa-copy"></i></button>`;
                    }
                    if (field.isAccess) {
                        extraClass = 'token access-token-value';
                        extraHtml = `<button class="copy-btn" onclick="copyAccess()" title="Copy"><i class="fas fa-copy"></i></button>`;
                    }

                    if (field.key === 'level' || field.key === 'exp') {
                        extraClass = 'highlight';
                    }

                    html += `
                        <div class="response-item">
                            <div class="label"><i class="fas ${field.icon}"></i> ${field.label}</div>
                            <div class="value ${extraClass}">
                                ${value}
                                ${extraHtml}
                            </div>
                        </div>
                    `;
                }
            }

            // Credits
            if (data.credits) {
                html += `
                    <div class="response-item" style="grid-column: 1/-1; background: rgba(255,215,0,0.05); border-color: rgba(255,215,0,0.1);">
                        <div class="label"><i class="fas fa-crown"></i> Credits</div>
                        <div class="value" style="color: #ffd93d;">${data.credits}</div>
                    </div>
                `;
            }
        }

        responseContent.innerHTML = html;
    }

    // Clear
    function clearAll() {
        uidInput.value = '';
        passwordInput.value = '';
        uidInput.classList.remove('error');
        passwordInput.classList.remove('error');
        responseSection.classList.remove('active');
        responseContent.innerHTML = '';
        showToast('Cleared', 'success');
    }

    // Event Listeners
    generateBtn.addEventListener('click', generateToken);
    clearBtn.addEventListener('click', clearAll);

    // Enter key support
    uidInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') passwordInput.focus();
    });
    passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') generateToken();
    });

    // Remove error state on focus
    uidInput.addEventListener('focus', () => uidInput.classList.remove('error'));
    passwordInput.addEventListener('focus', () => passwordInput.classList.remove('error'));

    // Check API health on load
    async function checkHealth() {
        try {
            const response = await fetch('/');
            const data = await response.json();
            if (data.status === 'online') {
                // All good
            }
        } catch (e) {
            // API might not be reachable
        }
    }
    checkHealth();
</script>
</body>
</html>
